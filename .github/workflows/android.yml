name: Build PostBee APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 8.9 — repo mein gradlew wrapper NAHI hai, is liye setup-gradle action use hoti hai.
      # setup-android step NAHI lagana (runners par SDK pehle se maujood hai).
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PostBee build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
